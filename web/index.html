<!doctype html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="RouteLeaf turns bounded XLSForm questionnaires into context-specific paper interviewer cards with explicit next destinations."><title>RouteLeaf — Paper interview cards</title><link rel="stylesheet" href="./styles.css"></head><body><a class="skip" href="#workspace" data-t="skip"></a><header class="top"><a class="brand" href="#">RouteLeaf<span class="brand-leaf" aria-hidden="true">↗</span></a><label class="language">Language <select id="language" aria-label="Interface language"><option value="ja">日本語</option><option value="en">English</option></select></label></header><main><section class="hero"><div><p class="eyebrow" data-t="eyebrow"></p><h1 data-t="title"></h1><p class="intro" data-t="intro"></p><p class="local"><span aria-hidden="true">◉</span> <span data-t="local"></span></p></div><div class="illustration" aria-hidden="true"><div class="paper back"><span>C04</span><p>Print experience</p><b>Next → C08</b></div><div class="paper front"><span>C05</span><p>Print experience</p><b>Next → C12</b><small>Same question.<br>Different destination.</small></div></div></section><section id="workspace" tabindex="-1"><div class="input-panel"><div><h2 data-t="step1"></h2><label class="drop" for="source-input"><span class="file-icon" aria-hidden="true">↥</span><strong data-t="upload"></strong><span id="file-name" data-t="fileEmpty"></span><input id="source-input" type="file" accept=".xlsx,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"></label><div class="sample-row"><button id="sample" class="secondary" data-t="sample"></button><button id="sample-download" class="text-button" data-t="sampleDownload"></button></div><div class="control-row"><label class="field"><span data-t="formLanguage"></span><select id="form-language" disabled></select></label><button id="compile" class="primary" disabled data-t="compile"></button><button id="reset" class="text-button" data-t="reset"></button></div></div><aside><h3 data-t="scopeTitle"></h3><p data-t="scope"></p><p data-t="limits"></p><p class="warning" data-t="forward"></p></aside></div><p id="notice" role="status" aria-live="polite" hidden></p><section id="results" hidden><div class="section-top"><h2 data-t="step2"></h2><span id="form-title"></span></div><div id="stats" class="stats"></div><p class="why" data-t="why"></p><div id="unreachable" class="warning" hidden></div><div class="downloads"><button id="download-pdf" class="primary" data-t="downloadPdf"></button><button id="download-html" class="secondary" data-t="downloadHtml"></button><button id="download-answers" class="secondary" data-t="downloadAnswers"></button><button id="download-routes" class="secondary" data-t="downloadRoutes"></button></div><div class="walk-layout"><section class="walk"><div class="section-top"><h3 data-t="walkthrough"></h3><button id="restart" class="text-button" data-t="restart"></button></div><p data-t="walkHint"></p><div id="active-card"></div></section><aside class="trace"><h3 data-t="trace"></h3><ol id="trace"></ol></aside></div><details id="card-details"><summary data-t="variants"></summary><p data-t="variantsHelp"></p><div id="card-list" class="card-list"></div></details></section></section><footer><p data-t="footer"></p><p data-t="claim"></p></footer></main><script type="module" src="./app.js"></script></body></html>
